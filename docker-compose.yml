services:
  api:
    build: ./api
    env_file: .env
    ports:
      - "8000:8000"          # Swagger UI: http://localhost:8000/docs
    restart: unless-stopped

  node-red:
    image: nodered/node-red:4.0
    ports:
      - "1880:1880"          # editor: http://localhost:1880  dashboard: http://localhost:1880/dashboard
    volumes:
      - ./node-red:/data     # flows, settings and installed nodes are kept in the repository folder
    extra_hosts:
      # the existing flows call http://host.docker.internal:8000 ; this makes that name work on Linux too
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
    restart: unless-stopped
